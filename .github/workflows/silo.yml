name: Silo

# Builds and tests the Silo backend only. The Jellyfin and Emby plugins have
# their own workflow and never read anything under Silo/.

on:
  push:
    branches: [master]
    paths: ['Silo/**', '.github/workflows/silo.yml']
  pull_request:
    branches: [master]
    paths: ['Silo/**', '.github/workflows/silo.yml']

permissions:
  contents: read

jobs:
  silo:
    name: Build Silo plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Silo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: Silo/go.mod
          cache-dependency-path: Silo/go.sum

      - name: Use the published SDK only
        run: |
          if grep -q '^replace' go.mod || [ -n "$(go env GOWORK)" ]; then
            echo "::error::Silo/go.mod must build from the tagged silo-plugin-sdk, not a local replace or go.work."
            exit 1
          fi

      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Run gofmt on: $unformatted"
            exit 1
          fi

      - name: Test
        run: make test

      - name: Build
        run: make dist

      # Silo reads the manifest by running the binary with "manifest", so this
      # is the same check an install does.
      - name: Check the manifest
        run: ./dist/Moonbase.Silo-*-linux-amd64 manifest > /dev/null

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Moonbase.Silo
          path: Silo/dist/
